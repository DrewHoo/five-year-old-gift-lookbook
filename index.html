.legend{font-size:14px;color:var(--muted);margin:16px 0 0;max-width:900px}

#wild{background:var(--paper)}
#do{background:#f3e7c6}

const COPY = {"title_options": ["Gifts for a 5-Year-Old Who Loves Masking Tape and Crafts", "Gift Ideas for a Boy Turning Five, All Under $75", "5-Year-Old Gift Ideas: Tape, Trains, Lucha and a Teepee"], "title": "Gifts for a 5-Year-Old Who Loves Masking Tape and Crafts", "h1_options": ["The tape won’t come off the roll", "Gifts for a five-year-old luchador", "Tape, cardboard and a felt mask"], "h1": "The tape won’t come off the roll", "kicker_tail": "for a boy turning five who builds with tape", "sub": "Gift ideas for an almost-five-year-old who builds things out of masking tape but can’t get it off the roll by himself. He also has Magna-Tiles, BRIO track and a teepee he likes to sit in, and when he isn’t in it he moves through the house like a luchador. Drew set the rules: under $75 each, nothing big, messy or loud, and it has to arrive by Christmas. The tape trouble turned out to be about the hole in the middle of the roll, and the fixes come first.", "meta_description": "Gift ideas for a boy turning five who builds with masking tape: tape he can tear, a story projector for his teepee, Makedo kits and lucha masks.", "picks_h": "If you buy three", "picks_why": "The tape center fixes the problem he has today, with eight rolls on a wooden stand and a plastic edge to cut against. The Story Dream Machine puts a picture book’s pages on the teepee wall and reads them aloud, and he can start it without borrowing anyone’s phone. The felt mask costs $16, fits a child’s face, and makes him a luchador by dinner.", "box1h": "It’s the hole in the roll", "box1": "Ordinary masking and painter’s tape is wound on a 3-inch core, and most desk dispensers take a 1-inch one, so a desk dispenser won’t hold the tape he uses. Classroom tape stations with a plastic cutting edge get around that, but most cost about $99, and Lakeshore’s half-inch station at $69.99 is the one under the ceiling. It runs on its own narrow tape. For $19, Uline’s three-roll dispenser takes the masking tape already in the house, behind a metal blade a grown-up has to mind, and narrow craft tape that tears by hand skips the dispenser altogether.", "box2h": "A projector he can run himself", "box2": "Story projectors suit a five-year-old in a tent best: the Story Dream Machine and the Luna StoryTime put a picture book’s pages on the wall and read them aloud, on AA batteries and with no phone, so story time starts when he decides. Moonlite costs less, but it clips onto a grown-up’s phone, which makes it something you do with him. Video projectors under $100 came out dim in tests by TechGearLab and The Smart Home Hookup, brighter on the box than on the wall. The one they found tolerable needs a cord and runs a fan, and neither belongs inside a fabric tent.", "legend": "Everything with a card was in stock and under $75 when we opened its listing in a browser on November 27, 2026. Prices and stock change, so expect some of this to have moved. Amazon wasn’t checked, because its pages bar AI agents.", "sections": {"tape": {"title": "Tape he can run", "intro": "The tape center fixes the dispenser problem, and the craft tape gets around it by tearing in his hands. The Uline dispenser is the one that takes the masking tape already in the house."}, "build": {"title": "Cardboard and labels", "intro": "Makedo is the building he already does with tape, moved into cardboard boxes and held together with screws he can back out and use again. The label maker gives each build a name."}, "proj": {"title": "Projectors", "intro": "These are ranked by how much he can run without a grown-up. That puts Moonlite, which needs a phone, below a shark flashlight that has no story at all."}, "cozy": {"title": "In the teepee", "intro": "The teepee is already his, so these are for the inside: two lights, a weighted puppy for his lap, stories he can play himself, and books and puzzles that need nobody else. No floor cushion under $75 could be confirmed to fit, so there isn’t one."}, "sets": {"title": "Tiles and trains", "intro": "Each of these changes what his Magna-Tiles or BRIO track can do. The train-track toppers are the only thing here that works with both."}, "lucha": {"title": "Luchador", "intro": "A child-size lucha mask from a US seller was the hardest thing on this page to find. Most masks sold as youth sizes are cut for ages 6 to 12 or ship from abroad, and two Etsy shops had a kid size arriving in December."}, "gear": {"title": "Grown-up gear, small", "intro": "Things an adult carries, made to fit him. Half of them light up."}, "wild": {"title": "Unrelated, on purpose", "intro": "Drew asked for ideas past anything he’d described. Each of these has a mechanism to work out, like a bird that flies on a rubber band or a top that turns itself over."}, "do": {"title": "To do, not to own", "intro": "Two subscriptions that put something with his name on it in the mailbox, and a lucha show for a family willing to stay up."}, "cut": {"title": "Checked and left out", "intro": "These were priced or opened and didn’t make it, and each has its reason beside it. A few were on the first version of this page and came off after Drew read it. A couple were only sold out and may come back."}}, "notes": {"tapecenter": "He pulls a strip, tears it on the edge, and nobody has to start the roll for him. Refills have to be Lakeshore’s own half-inch tape.", "colorations": "Tape that tears by hand needs no dispenser, so there is nothing to start and nothing to cut. The masking tape will look plain next to it.", "uline": "An industrial dispenser that takes the rolls already in the house. The blade is metal, so the dispenser lives where a grown-up can see it.", "makedo-discover": "This is where tape leads: cardboard he cuts himself, joined with screws he can back out and use again. Start saving boxes now.", "makedo-explore": "A smaller box for finding out whether cardboard holds him the way tape does. The screws are just as small as the bigger kit’s.", "dymo": "Each letter is a turn of the wheel and a firm squeeze, and out comes a raised label for his latest build. Reviews disagree on how long it lasts.", "railracers": "Clear rails clip onto tiles he already has and turn a tower into a ball run. The ball is small, so it goes on a shelf at night.", "toppers": "The one thing on the page that joins his two sets, laying printed track across a tile floor. It’s clearance stock and may not last.", "builder": "Two cranes that reach up and set tiles in place, which gives a tall build somewhere to go. Part of the box is more tiles.", "bridge": "He cranks the span up, and every train on the line waits for him to let it down.", "turntable": "Seven tracks meet at one spinning plate, so a single engine can be sent anywhere on the layout.", "crossing": "The engine’s own magnet drops the barrier as it goes by. Expect it to be tested many times before anything else gets built.", "supports": "Track high enough to build under, which means Magna-Tile tunnels and stations beneath the BRIO line.", "cars": "Two magnetic chassis that put wheels under whatever he builds. It’s the cheapest way here to make the tiles move.", "downhill": "Ramps and two wheeled riders, so a tower has a way down as well as up. Of the tile sets here it costs the most.", "mask-felt": "Soft felt, cut for a child’s face, which most lucha masks we found were not. Of the luchador gifts, it has the least that can go wrong.", "mask-full": "The full pullover look, from a California shop that makes a kid size. The listing has no size chart, so ask the seller for measurements first.", "mask-kit": "He builds his own mask from sticky foam, so it’s a craft before it’s a costume. Twelve kits means eleven for friends or stuffed animals.", "belt": "Something to win and defend in the living room. It’s WWE rather than lucha, and cut for six and up, so it may hang long on him.", "nino": "The luchador picture book, and the obvious one for a boy who wrestles. Bookshop.org is out until February, so the link goes to Barnes & Noble.", "training": "Comic panels let him follow the story before he can read it. A good one for the night after Niño.", "headlamp": "Hands-free light for the teepee, or for the cardboard fort the Makedo kit will sooner or later produce.", "safe": "Two locks on a metal box, for whatever a five-year-old decides is valuable. Keep a spare key somewhere he doesn’t know about.", "watch": "A reason to ask how long until dinner, and eventually a way to check the answer himself.", "binoculars": "For birds in the yard and trucks down the street. The bag gives them somewhere to live besides the floor.", "flashlight": "Clipped to a belt loop, it goes wherever he goes, which is most of what a flashlight is for.", "squeeze": "It lights only while he squeezes, so it can’t be left burning under the bed.", "timbird": "Wind the rubber band, let go, and it flaps off across the park. It’s fragile, so this is for open grass and a grown-up’s hands at first.", "musicbox": "He punches holes in a paper strip, cranks it through, and hears the song he wrote. The punching takes help at first.", "labyrinth": "Two knobs tilt the board to steer a steel ball past the holes. Expect him to lose to it for a long while.", "dragon": "A board game short enough to finish before attention runs out. The gems are small and many, so play at the table and count them back in.", "rushhour": "Slide the other vehicles around until his gets out of the jam. It’s a quiet thing to hand him when the wrestling needs a break.", "top": "Spin it on its round end and partway through it flips over onto its stem. Explaining why can wait a few years.", "kamifusen": "Paper cubes he blows up himself and bats around the house, too light to knock anything over. When they tear, you buy four more.", "beetle": "Wind it and it crawls across the table with its wings going. It’s small enough to come out of a pocket at a restaurant.", "rainbow": "On a sunny morning it sends rainbows sliding around his room with nobody touching it. Mount it high, where the crystal stays out of reach.", "rangerrick": "A magazine addressed to him, which at five is half the gift. The first issue may come after Christmas, so wrap a printout of the order.", "kiwico": "One building project a month, for a boy who already builds with tape. He’s near the top of the age range and will move up to Kiwi Crate soon.", "lucha-live": "Masked wrestlers in person, if a tour date is within a drive. It means a late night in a loud arena, so plan it like a trip.", "dreammachine": "Story time he starts himself, with the pages on the teepee wall and a voice reading them. Give the cartridges a box of their own.", "luna": "It aims at the ceiling too, so the story can happen with him flat on his back. It also does the job of a night light.", "sharktorch": "A stocking stuffer he works alone: point it at the teepee wall and click through sharks. There’s nothing to read and nothing to finish.", "moonlite": "The reel goes over a grown-up’s phone, so this is a bedtime story you run together. It’s the cheapest story on the page.", "lumipets": "It charges and then runs with no cord, which is what a fabric tent needs. He will learn the color-changing tap within a minute.", "lantern": "A child’s camping lantern, for a tent that happens to be indoors.", "lappad": "Three pounds of stuffed puppy across his legs at the end of a loud day. It asks him to sit still without anyone saying so.", "storybutton": "Yoto Mini and Toniebox Lite cost $79.99, so this is the story player under the ceiling. Find out what it plays without the yearly plan.", "headphones": "With these on, the story stays inside the teepee and the rest of the house stays quiet.", "camelot": "Wooden blocks, a knight to get across them, and an hour in the teepee when he wants nobody else in there.", "forts": "A picture book about forts, for a boy who reads in one.", "journey": "Every page is a picture, so the story is whatever he says it is that night.", "dark": "For the teepee after dark, read by whichever lamp he’s holding.", "stickers": "The nearest thing here to tape: he sticks things down, peels them up and starts over, and nothing ends up on the furniture.", "glowpuzzle": "He builds it with the lantern on, then switches it off to see the skeletons. Plan on doing the edges with him the first time."}, "footer": "A personal list, with no affiliate links and no paid placements. Every listing was checked on November 27, 2026."};
const SECS = ['tape','build','proj','cozy','sets','lucha','gear','wild','do'];
const TIERS = [['all','All',()=>true],['u15','Under $15',p=>p<15],['u35','$15 to $35',p=>p>=15&&p<=35],['u75','$35 to $75',p=>p>35]];

const $ = (s,el=document) => el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + (Number.isInteger(n) ? n : n.toFixed(2));
const disp = (u,w) => u.includes('cdn.shopify.com') ? u+(u.includes('?')?'&':'?')+'width='+w
  : u.includes('etsystatic') ? u.replace('il_fullxfull.', w>300?'il_794xN.':'il_170x135.')
  : u.includes('/is/image/') ? u+'?wid='+w
  : u.includes('contentstack.io') ? u+'&width='+w
  : u.includes('cloudfront.net/images/products/515x515') && w<300 ? u.replace('515x515','96x96') : u;

function card(it){
  const imgs = (it.imgs||[]).map(u => ({full:u, d:disp(u,800), t:disp(u,120)}));
  const chips = [
    it.age ? `<span class="chip age">${esc(it.age)}</span>` : '',
    it.sup ? `<span class="chip sup">${esc(it.sup)}</span>` : '',
    ...(it.specs||[]).map(s=>`<span class="chip">${esc(s)}</span>`),
    ...(it.flags||[]).map(f=>`<span class="chip flag">${esc(f)}</span>`)
  ].join('');
  const host = new URL(it.url).hostname.replace(/^www\./,'');
  const media = imgs.length
    ? `<img class="main" src="${imgs[0].d}" data-full="${imgs[0].full}" alt="${esc(it.brand+' '+it.name)}" loading="lazy">
      ${imgs.length>1?`<div class="thumbs">${imgs.map((im,i)=>`<img src="${im.t}" data-disp="${im.d}" data-full="${im.full}" class="${i?'':'on'}" alt="" loading="lazy">`).join('')}</div>`:''}`
    : `<div class="noimg">${esc(it.tile||it.name)}</div>`;
  return `<article class="card" data-id="${it.id}" data-price="${it.price??''}">
    <span class="rank">#${it.rank}</span>
    <div class="media">${media}</div>
    <div class="body">
      <div class="shop">${it.brand===it.via?esc(it.brand):esc(it.brand)+' · '+esc(it.via)}</div>
      <div><h3>${esc(it.name)}</h3>${it.variant?`<div class="variant">${esc(it.variant)}</div>`:''}</div>
      <div class="price">${it.priceLabel?esc(it.priceLabel):money(it.price)}${it.priceNote?` <small>${esc(it.priceNote)}</small>`:''}</div>
      <div class="chips">${chips}</div>
      <p class="note">${esc((COPY.notes||{})[it.id]||'')}</p>
      ${it.rating?`<div class="rating">${esc(it.rating)}</div>`:''}
      <div class="actions">
        <a class="buy" href="${it.url}" target="_blank" rel="noopener">${esc(it.cta||('Buy at '+(host.length>16?it.via:host)))} ↗</a>
        ${it.also?`<a class="buy alt" href="${it.also.url}" target="_blank" rel="noopener">${esc(it.also.label)} ↗</a>`:''}
        ${it.price!=null?`<button class="add" type="button" aria-pressed="false">+ Shortlist</button>`:''}
      </div>
    </div>
  </article>`;
}

function render(){
  $('#kickerTail').textContent = COPY.kicker_tail;
  $('#h1').innerHTML = `<span class="tapeband">${esc(COPY.h1)}</span>`;
  $('#sub').textContent = COPY.sub;
  $('#picksH').textContent = COPY.picks_h;
  $('#picksWhy').textContent = COPY.picks_why;
  $('#box1h').textContent = COPY.box1h; $('#box1').textContent = COPY.box1;
  $('#box2h').textContent = COPY.box2h; $('#box2').textContent = COPY.box2;
  $('#legend').textContent = COPY.legend;
  $('#footer').textContent = COPY.footer;

  const S = COPY.sections||{};
  $('#sections').innerHTML = SECS.map(sec=>{
    const items = ITEMS.filter(i=>i.sec===sec).sort((a,b)=>a.rank-b.rank);
    return `<section id="${sec}"><div class="wrap">
      <div class="sec-head"><h2>${esc(S[sec]?.title)}</h2><span class="count" data-count="${sec}"></span></div>
      <p class="intro">${esc(S[sec]?.intro)}</p>
      <div class="grid">${items.map(card).join('')}</div>
      <p class="empty" hidden>Nothing in this price range here.</p>
    </div></section>`;
  }).join('') + `<section id="cut"><div class="wrap">
      <div class="sec-head"><h2>${esc(S.cut?.title)}</h2><span class="count">${CUT.length} checked</span></div>
      <p class="intro">${esc(S.cut?.intro)}</p>
      <ul class="cutlist">${CUT.map(c=>`<li><span class="n">${c.url?`<a href="${c.url}" target="_blank" rel="noopener">${esc(c.name)}</a>`:esc(c.name)}</span><span class="r">${esc(c.why)}</span></li>`).join('')}</ul>
    </div></section>`;

  $('#pills').innerHTML = SECS.map(s=>`<a class="pill" href="#${s}">${esc(S[s]?.title)} · ${ITEMS.filter(i=>i.sec===s).length}</a>`).join('')
    + `<a class="pill" href="#cut">${esc(S.cut?.title)} · ${CUT.length}</a>`;

  const by = id => ITEMS.find(i=>i.id===id);
  $('#three').innerHTML = TOP.map(by).filter(Boolean).map(it=>`<a href="#card-${it.id}" data-jump="${it.id}">
      ${it.imgs?.length?`<img src="${disp(it.imgs[0],160)}" alt="">`:'<span></span>'}
      <div><b>${esc(it.short||it.name)}</b><span>${it.priceLabel?esc(it.priceLabel):money(it.price)}</span></div></a>`).join('');

  $('#filters').insertAdjacentHTML('beforeend', TIERS.map(([k,l,f])=>{
    const n = ITEMS.filter(i=>k==='all'||(i.price!=null&&f(i.price))).length;
    return n ? `<button class="fchip" type="button" data-tier="${k}" aria-pressed="${k==='all'}">${l} · ${n}</button>` : '';
  }).join(''));
}

/* price filter */
function applyTier(k){
  const f = TIERS.find(t=>t[0]===k)[2];
  document.querySelectorAll('.fchip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.tier===k));
  SECS.forEach(sec=>{
    const s = document.getElementById(sec); let n = 0;
    s.querySelectorAll('.card').forEach(c=>{
      const p = c.dataset.price===''?null:+c.dataset.price;
      const show = k==='all' || (p!=null && f(p)); c.hidden = !show; if (show) n++;
    });
    $('[data-count]',s).textContent = n + (n===1?' pick':' picks');
    $('.empty',s).hidden = n>0;
  });
}

/* shortlist */
let SEL;
try { SEL = new Set(JSON.parse(localStorage.getItem('gift-shortlist')||'[]')); } catch(e){ SEL = new Set(); }
function save(){ try { localStorage.setItem('gift-shortlist', JSON.stringify([...SEL])); } catch(e){} }
function tally(){
  const picked = ITEMS.filter(i=>SEL.has(i.id) && i.price!=null);
  const total = picked.reduce((a,i)=>a+i.price,0);
  $('#tallyNums').innerHTML = picked.length
    ? `${picked.length} gift${picked.length>1?'s':''} · <b>$${total.toFixed(2)}</b> before shipping · ${picked.map(i=>esc(i.short||i.name)).join(', ')}`
    : 'Nothing picked. Tap “+ Shortlist” on a card to add it up.';
  document.querySelectorAll('.card').forEach(c=>{
    const on = SEL.has(c.dataset.id); c.classList.toggle('sel', on);
    const b = $('.add',c); if (b){ b.setAttribute('aria-pressed', on); b.textContent = on ? '✓ Shortlisted' : '+ Shortlist'; }
  });
}

document.addEventListener('click', e=>{
  const fc = e.target.closest('.fchip'); if (fc){ applyTier(fc.dataset.tier); return; }
  const j = e.target.closest('[data-jump]');
  if (j){ e.preventDefault(); applyTier('all'); document.querySelector(`.card[data-id="${j.dataset.jump}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const add = e.target.closest('.add');
  if (add){ const id = add.closest('.card').dataset.id; SEL.has(id)?SEL.delete(id):SEL.add(id); save(); tally(); return; }
  if (e.target.closest('#tallyClear')){ SEL.clear(); save(); tally(); return; }
  const th = e.target.closest('.thumbs img');
  if (th){ const card = th.closest('.card'); const m = $('.main',card); m.src = th.dataset.disp; m.dataset.full = th.dataset.full;
    card.querySelectorAll('.thumbs img').forEach(t=>t.classList.toggle('on', t===th)); return; }
  const main = e.target.closest('.main');
  if (main){ $('#lbimg').src = main.dataset.full; $('#lb').classList.add('on'); return; }
  if (e.target.closest('#lb')) $('#lb').classList.remove('on');
});
// a CDN that hiccups once shouldn't leave a hole: retry a failed image twice
document.addEventListener('error', e=>{
  const im = e.target; if (!(im instanceof HTMLImageElement)) return;
  const n = +(im.dataset.retry||0); if (n>=2) return; im.dataset.retry = n+1;
  const src = im.getAttribute('src'); setTimeout(()=>{ im.src = src + (src.includes('?')?'&':'?') + 'retry=' + (n+1); }, 900*(n+1));
}, true);
document.addEventListener('keydown', e=>{ if (e.key==='Escape') $('#lb').classList.remove('on'); });
render(); applyTier('all'); tally();
</script>
